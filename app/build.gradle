plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.traveljournal.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.traveljournal.app"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 演示/自装用 debug 签名即可（正式上架再换成自己的 release 密钥）
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.13.1'
}
